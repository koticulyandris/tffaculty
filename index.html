<title>Проклятье четверки: Тату-рулетка</title>

<style>
/* Концепция: ночное кладбище, большая тыква-кнопка и колесо-рулетка с лампочками. */
:root {
  --night: #120b1a;
  --black: #1B1B1B;
  --violet: #8001FF;
  --violet-hi: #A99BF2;
  --violet-deep: #3d0080;
  --bone: #ECE8FF;
  --mute: #B5B0CC;
  --orange: #FF7A1A;
  --orange-hi: #FFB04A;
  --orange-deep: #C2410C;
  --f-display: 'Rubik Wet Paint', 'Impact', 'Arial Black', sans-serif;
  --f-body: 'Golos Text', 'Segoe UI', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0; min-height: 100vh; position: relative; overflow-x: hidden;
  background: var(--night); color: var(--bone);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange-hi); outline-offset: 4px; }
.mono { font-family: var(--f-mono); letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; }

/* ---------- фон ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.scene::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(70vw 55vw at 85% 0%, rgba(128,1,255,.34), transparent 70%),
    radial-gradient(80vw 40vw at 10% 100%, rgba(255,122,26,.16), transparent 70%),
    linear-gradient(180deg, #170d24 0%, #120b1a 55%, #0e0813 100%);
}
.moon {
  position: absolute; top: 5vh; right: 7vw; width: clamp(90px, 16vw, 190px); aspect-ratio: 1; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 30%, #fff7e0 0 8%, transparent 9%),
    radial-gradient(circle at 62% 58%, rgba(210,190,150,.5) 0 10%, transparent 11%),
    radial-gradient(circle at 40% 72%, rgba(210,190,150,.45) 0 6%, transparent 7%),
    radial-gradient(circle at 38% 34%, #fff1c9, #f2d98f 70%, #d9b95f);
  box-shadow: 0 0 60px 20px rgba(255,214,120,.22), 0 0 160px 60px rgba(255,160,40,.12);
}
.web { position: absolute; top: -210px; left: -210px; width: 420px; height: 420px; opacity: .5; }
.bat { position: absolute; left: -90px; width: 56px; color: #0b0610; opacity: .95; animation: fly linear infinite; }
.bat svg { display: block; width: 100%; height: auto; animation: flap .45s ease-in-out infinite alternate; transform-origin: 50% 60%; }
.bat.b1 { top: 12vh; animation-duration: 26s; }
.bat.b2 { top: 26vh; width: 40px; animation-duration: 34s; animation-delay: -12s; }
.bat.b3 { top: 8vh; width: 34px; animation-duration: 41s; animation-delay: -27s; }
@keyframes fly { from { transform: translate(-10vw, 0); } 50% { transform: translate(55vw, 40px); } to { transform: translate(115vw, -10px); } }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.55); } }
.yard { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(90px, 16vw, 190px); }
.fog {
  position: absolute; left: -10%; right: -10%; bottom: 0; height: 30vh;
  background: radial-gradient(60% 100% at 30% 100%, rgba(169,155,242,.14), transparent 70%), radial-gradient(50% 90% at 78% 100%, rgba(255,122,26,.08), transparent 70%);
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translateX(-3%); } to { transform: translateX(3%); } }

/* ---------- шапка и подвал ---------- */
.top, .foot, .stage { position: relative; z-index: 2; width: 100%; max-width: 980px; margin-inline: auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 18px; }
.brand { font-family: var(--f-mono); letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; color: var(--bone); }
.brand b { color: var(--orange-hi); font-weight: 500; }
.brand time { font-variant-numeric: tabular-nums; color: var(--orange-hi); }
.brand .msk { color: var(--mute); font-size: .7rem; }
.social { display: flex; gap: 8px; flex-wrap: wrap; }
.social a {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 7px 13px;
  border: 1px solid rgba(169,155,242,.5); background: rgba(18,11,26,.6);
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
  transition: background .2s, border-color .2s;
}
.social a:hover { background: var(--violet); border-color: var(--violet); }
.social svg { width: 18px; height: 18px; color: var(--violet-hi); flex: none; }
.social a:hover svg { color: var(--bone); }

/* ---------- сцена ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-block: 12px 28px; text-align: center; }
.eyebrow { margin: 0; color: var(--violet-hi); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.02;
  font-size: clamp(2.6rem, 10vw, 5.6rem); color: var(--bone);
  text-shadow: 0 0 28px rgba(128,1,255,.55), 0 4px 0 rgba(0,0,0,.35);
  overflow-wrap: anywhere;
}
h1 em { font-style: normal; color: var(--orange); text-shadow: 0 0 30px rgba(255,122,26,.55), 0 4px 0 rgba(0,0,0,.35); }
.hint { margin: 0; color: var(--mute); max-width: 36ch; }

/* кнопка-тыква */
.spin {
  position: relative; border: 0; cursor: pointer; margin-top: 30px;
  width: min(86vw, 440px); aspect-ratio: 1.55;
  font-family: var(--f-display); font-size: clamp(2.6rem, 11vw, 5rem); line-height: 1; color: #2a1200; letter-spacing: .02em;
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
  background: radial-gradient(ellipse at 38% 28%, var(--orange-hi), var(--orange) 48%, var(--orange-deep) 100%);
  box-shadow: inset -14px -18px 30px rgba(110,30,0,.45), inset 10px 10px 24px rgba(255,220,150,.35), 0 0 50px 6px rgba(255,122,26,.45), 0 24px 40px rgba(0,0,0,.5);
  animation: glow 2.6s ease-in-out infinite;
  transition: transform .18s, filter .18s;
  display: grid; place-items: center;
}
.spin::before {
  content: ""; position: absolute; top: -13%; left: 50%; width: 15%; height: 20%; transform: translateX(-50%) rotate(6deg);
  background: linear-gradient(90deg, #6b3fa0, #3d0080); border-radius: 30% 30% 12% 12% / 40% 40% 10% 10%;
  box-shadow: inset -4px 0 6px rgba(0,0,0,.35);
}
.spin::after {
  content: ""; position: absolute; inset: 4% 24%; border-left: 4px solid rgba(110,30,0,.32); border-right: 4px solid rgba(110,30,0,.32);
  border-radius: 50%; pointer-events: none;
}
.spin span { position: relative; z-index: 1; text-shadow: 0 2px 0 rgba(255,220,150,.45); }
.spin:hover { transform: scale(1.05) rotate(-1.5deg); filter: brightness(1.08); }
.spin:active { transform: scale(.97); }
.spin[hidden] { display: none; }
.spin.compact { width: min(66vw, 300px); font-size: clamp(2rem, 8vw, 3.4rem); margin-top: 22px; }
.spin[disabled] { cursor: progress; filter: grayscale(.4) brightness(.8); animation: none; }
@keyframes glow {
  0%, 100% { box-shadow: inset -14px -18px 30px rgba(110,30,0,.45), inset 10px 10px 24px rgba(255,220,150,.35), 0 0 40px 2px rgba(255,122,26,.35), 0 24px 40px rgba(0,0,0,.5); }
  50% { box-shadow: inset -14px -18px 30px rgba(110,30,0,.45), inset 10px 10px 24px rgba(255,220,150,.35), 0 0 80px 14px rgba(255,122,26,.6), 0 24px 40px rgba(0,0,0,.5); }
}

/* колесо */
.stage.spinning .eyebrow, .stage.spinning .hint { display: none; }
.stage.spinning h1 { font-size: clamp(1.8rem, 5.5vw, 2.8rem); }
.wheelbox { display: grid; justify-items: center; gap: 12px; width: min(94vw, 540px, max(270px, calc(100vh - 290px))); animation: pop .5s cubic-bezier(.2,1.2,.3,1); }
.wheelbox[hidden] { display: none; }
.wheelbox.fade { opacity: 0; transform: scale(.92); transition: opacity .6s, transform .6s; }
@keyframes pop { from { opacity: 0; transform: scale(.7) rotate(-12deg); } to { opacity: 1; transform: none; } }
.wlabel { margin: 0; color: var(--orange-hi); }
.wheelwrap { position: relative; width: 100%; aspect-ratio: 1; }
.wheelwrap svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 30px rgba(128,1,255,.55)); }
.pointer {
  position: absolute; z-index: 3; top: -1%; left: 50%; transform: translateX(-50%);
  border-left: 17px solid transparent; border-right: 17px solid transparent; border-top: 38px solid var(--orange-hi);
  filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,122,26,.8));
}
.seg path.bg { transition: fill .4s, opacity .4s; }
.wheelwrap svg.done .seg { opacity: .22; transition: opacity .5s; }
.wheelwrap svg.done .seg.win { opacity: 1; filter: drop-shadow(0 0 12px rgba(255,160,50,.9)); }
.wheelwrap svg.done .seg.win path.bg { fill: var(--orange); }
.bulb { animation: blink 1s steps(1) infinite; }
.bulb.odd { animation-delay: .5s; }
@keyframes blink { 0% { fill: #ffd27a; } 50% { fill: #6b3a10; } }
.verdict { margin: 0; min-height: 1.2em; font-family: var(--f-display); font-size: clamp(1.7rem, 6vw, 2.8rem); color: var(--orange-hi); text-shadow: 0 0 22px rgba(255,122,26,.6); line-height: 1.1; }

/* итог */
.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(100%, 700px); margin-top: 10px; }
.results[hidden] { display: none; }
.card { margin: 0; min-width: 0; animation: rise .7s cubic-bezier(.2,1,.3,1) both; }
.card:nth-child(2) { animation-delay: .18s; }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
.art {
  position: relative; aspect-ratio: 1; padding: 6%;
  background: radial-gradient(circle at 50% 40%, rgba(128,1,255,.28), rgba(18,11,26,.92) 72%);
  border: 2px solid var(--orange); border-radius: 4px;
  box-shadow: 0 0 36px rgba(255,122,26,.28), inset 0 0 40px rgba(0,0,0,.4);
}
.art::before, .art::after { content: ""; position: absolute; width: 22px; height: 22px; border: 3px solid var(--orange-hi); pointer-events: none; }
.art::before { top: 7px; left: 7px; border-right: 0; border-bottom: 0; }
.art::after { bottom: 7px; right: 7px; border-left: 0; border-top: 0; }
.art img { display: block; width: 100%; height: 100%; object-fit: contain; }
.card figcaption { display: grid; gap: 2px; padding-top: 10px; text-align: left; }
.card .lab { color: var(--violet-hi); }
.card .nm { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.25rem, 4.6vw, 1.9rem); line-height: 1.1; color: var(--bone); overflow-wrap: anywhere; }

.foot { padding-block: 14px 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; color: var(--mute); }
.foot span { text-shadow: 0 1px 4px rgba(0,0,0,.8); }
@media (max-width: 560px) { .foot { justify-content: center; } .web { width: 280px; height: 280px; top: -140px; left: -140px; } }
@media (prefers-reduced-motion: reduce) {
  .bat, .fog, .spin, .bulb { animation: none !important; }
  .wheelbox, .card { animation: none !important; }
}
</style>
</head>

   name: подпись на колесе и под картинкой.
   src:  путь к своей картинке (например "img/skull.png", файл лежит
         рядом со страницей) или data:-адрес. Пока src пустой,
         показывается нарисованный на сайте набросок.
   Порядок в списках можно менять, а число эскизов и мест тоже:
   колесо подстроится само.

const CONFIG = {

    { name: "Тыква",         src: "" },

(function () {

    '<path d="M50 40 C44 28 30 22 8 28 C14 34 14 42 20 48 C26 44 32 46 36 54 C42 50 46 52 50 64 C54 52 58 50 64 54 C68 46 74 44 80 48 C86 42 86 34 92 28 C70 22 56 28 50 40Z"/>' +
    '<path d="M44 38 L41 26 L48 33 M56 38 L59 26 L52 33"/><path d="M46 52 L47 57 L50 53 L53 57 L54 52"/>' +
    '<path d="M45 44 H46 M54 44 H55"/>',
    /* Паук */
    '<path d="M50 3 V30"/><circle cx="50" cy="40" r="9"/><ellipse cx="50" cy="63" rx="13" ry="17"/>' +
    '<path d="M44 58 L26 46 L14 56 M42 65 L22 62 L12 75 M43 72 L26 82 L20 94 M45 52 L30 34 L18 38"/>' +
    '<path d="M56 58 L74 46 L86 56 M58 65 L78 62 L88 75 M57 72 L74 82 L80 94 M55 52 L70 34 L82 38"/>' +
    '<path d="M46 38 H47 M53 38 H54 M50 54 V72 M44 60 H56"/>',
    /* Чёрный кот */
    '<path d="M30 12 L36 28 C42 26 58 26 64 28 L70 12 L74 36 C76 48 66 56 50 56 C34 56 24 48 26 36Z"/>' +
    '<ellipse cx="40" cy="40" rx="4.5" ry="2.8"/><ellipse cx="60" cy="40" rx="4.5" ry="2.8"/>' +
    '<path d="M48 46 H52 L50 49Z M34 48 L18 46 M34 51 L18 55 M66 48 L82 46 M66 51 L82 55"/>' +
    '<path d="M34 56 C26 68 24 82 28 90 H72 C76 82 74 68 66 56 M42 90 V80 M58 90 V80"/>' +
    '<path d="M72 88 C88 88 92 74 84 66 C82 62 86 60 88 64"/>',
    /* Шляпа ведьмы */
    '<path d="M8 78 C24 70 76 70 92 78 C76 92 24 92 8 78Z"/>' +
    '<path d="M30 74 L44 40 C46 26 52 16 60 8 C62 24 66 30 72 74"/>' +
    '<path d="M33 66 C46 71 58 71 69 66"/><rect x="46" y="62" width="10" height="10"/>',
    /* Котёл */
    '<path d="M18 40 C14 62 22 84 38 86 H62 C78 84 86 62 82 40"/><ellipse cx="50" cy="40" rx="32" ry="7"/>' +
    '<path d="M34 86 L30 95 M66 86 L70 95 M18 46 C8 44 8 55 18 55 M82 46 C92 44 92 55 82 55"/>' +
    '<circle cx="42" cy="25" r="5"/><circle cx="58" cy="18" r="4"/><circle cx="52" cy="31" r="2.5"/>',
    /* Свеча */
    '<path d="M38 48 H62 V90 H38Z M28 90 H72"/><path d="M38 48 Q50 54 62 48"/>' +
    '<path d="M47 52 V63 C47 67 54 67 54 63 V53"/><path d="M50 48 V41"/>' +
    '<path d="M50 39 C40 31 44 20 50 8 C56 20 60 31 50 39Z"/><path d="M50 34 C47 30 48 26 50 21"/>',
    /* Глаз */
    '<path d="M6 50 C22 24 78 24 94 50 C78 76 22 76 6 50Z"/><circle cx="50" cy="50" r="15"/>' +
    '<ellipse cx="50" cy="50" rx="4" ry="9"/><path d="M50 8 V20 M26 14 L32 24 M74 14 L68 24"/>' +
    '<path d="M50 78 C46 84 46 90 50 93 C54 90 54 84 50 78Z"/>',
    /* Шрам со швами */
    '<path d="M14 80 C34 62 42 56 50 50 C58 44 70 36 86 20"/>' +
    '<path d="M25 66 L34 77 M35 58 L44 70 M46 52 L54 64 M58 44 L66 56 M70 34 L78 46"/>' +
    '<path d="M10 84 L19 75 M81 25 L90 16"/><path d="M28 46 C24 52 24 57 28 59 C32 57 32 52 28 46Z"/>',
    /* Скелет */
    '<circle cx="50" cy="14" r="9"/><path d="M45 13 H46 M54 13 H55 M45 21 H55"/><path d="M50 23 V56"/>' +
    '<path d="M50 30 C40 30 36 34 36 38 M50 30 C60 30 64 34 64 38 M50 37 C40 37 37 41 37 45 M50 37 C60 37 63 41 63 45 M50 44 C42 44 39 48 39 51 M50 44 C58 44 61 48 61 51"/>' +
    '<path d="M50 28 L32 30 L24 46 L30 62 M50 28 L68 30 L76 46 L70 62"/>' +
    '<path d="M38 56 C40 66 60 66 62 56 C56 52 44 52 38 56Z"/><path d="M44 64 L40 80 L42 94 H34 M56 64 L60 80 L58 94 H66"/>',
    /* Паутина */
    webInner(50, 50, 44, 8, 4) + '<circle cx="50" cy="50" r="1.2"/>' +
    '<path d="M72 74 V88 M72 82 a4 4 0 1 0 0.1 0"/>',
    /* Зелье */
    '<rect x="42" y="4" width="16" height="8"/><path d="M44 12 V30 C26 40 20 56 23 72 C25 84 35 91 50 91 C65 91 75 84 77 72 C80 56 74 40 56 30 V12"/>' +
    '<path d="M24 62 Q37 56 50 62 T76 62"/><circle cx="50" cy="73" r="6"/><path d="M48 73 H48.5 M52 73 H52.5 M47 79 V83 M53 79 V83"/>' +
    '<circle cx="39" cy="50" r="2"/><circle cx="59" cy="48" r="3"/>',
    /* Надгробие */
    '<path d="M24 90 V40 C24 22 36 12 50 12 C64 12 76 22 76 40 V90Z"/><path d="M10 90 H90"/>' +
    '<path d="M50 24 V46 M41 32 H59"/><path d="M14 90 L16 82 L19 90 M80 90 L82 80 L86 90"/>' +
    '<text x="50" y="72" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="' + INK + '" stroke="none">RIP</text>'
  ].map(function (inner, i) { return uri(wrap(inner, i + 2)); });

  function armSvg(zone) {
    var outline = 'M30 20 C30 10 40 6 50 6 C62 6 70 12 70 22 L67 46 C66 54 63 60 61 68 L65 73 V84 H41 V73 L45 68 C41 60 36 54 34 46Z';
    var fingers = 'M41 84 V94 a3 3 0 0 0 6 0 V84 M47 84 V97 a3 3 0 0 0 6 0 V84 M53 84 V97 a3 3 0 0 0 6 0 V84 M59 84 V94 a3 3 0 0 0 6 0 V84';
    var y = zone === 'hand' ? 68 : zone === 'forearm' ? 46 : 0;
    var hi = '<clipPath id="c"><path d="' + outline + '"/><rect x="41" y="82" width="24" height="16"/></clipPath>' +
      '<rect x="14" y="' + y + '" width="72" height="' + (100 - y) + '" fill="' + ORG + '" fill-opacity=".4" stroke="none" clip-path="url(#c)"/>' +
      (y > 0 ? '<path d="M22 ' + y + ' H78" stroke="' + ORG + '" stroke-width="1.8" stroke-dasharray="3 2.5"/>' : '');
    var lines = '<path d="' + outline + '"/><path d="' + fingers + '"/><path d="M41 76 C32 76 30 68 34 63"/>' +
      '<path d="M30 20 C22 24 20 38 20 60"/><path d="M30 20 Q50 28 70 22"/><path d="M35 44 Q51 51 67 44"/>';
    return wrap(hi + lines, 4);
  }
  function faceSvg(zone) {
    var head = '<ellipse cx="50" cy="38" rx="20" ry="24"/>';
    var dash = ' fill="' + ORG + '" fill-opacity=".4" stroke="' + ORG + '" stroke-width="1.8" stroke-dasharray="3 2.5"';
    var hi = '<clipPath id="c">' + head + '</clipPath>';
    if (zone === 'forehead') hi += '<rect x="28" y="12" width="44" height="16" clip-path="url(#c)"' + dash + '/>';
    if (zone === 'cheek') hi += '<ellipse cx="36" cy="47" rx="8" ry="6.5"' + dash + '/>';
    if (zone === 'face') hi += '<ellipse cx="50" cy="38" rx="20" ry="24"' + dash + '/>';
    if (zone === 'neck') hi += '<rect x="43" y="58" width="14" height="19"' + dash + '/>';
    var lines = head +
      '<path d="M30 36 C25 34 24 42 30 44 M70 36 C75 34 76 42 70 44"/>' +
      '<path d="M43 59 V76 M57 59 V76 M43 76 C32 78 22 84 18 96 M57 76 C68 78 78 84 82 96"/>' +
      '<path d="M38 30 H46 M54 30 H62 M38 36 Q42 33 46 36 M54 36 Q58 33 62 36 M50 37 V45 L47 47 M43 53 Q50 57 57 53"/>';
    return wrap(hi + lines, 6);
  }
  var PLACE_IMG = [
    uri(armSvg('hand')), uri(armSvg('forearm')), uri(armSvg('arm')),
    uri(faceSvg('cheek')), uri(faceSvg('forehead')), uri(faceSvg('face')), uri(faceSvg('neck'))
  ];

  /* ---------- данные ---------- */
  var sketches = CONFIG.sketches.map(function (it, i) {
    return { name: it.name, img: it.src || SKETCHES[i % SKETCHES.length] };
  });
  var places = CONFIG.places.map(function (it, i) {
    return { name: it.name, img: it.src || PLACE_IMG[i % PLACE_IMG.length] };
  });

  /* ---------- колесо ---------- */
  var wheel = $('wheel'), box = $('wheelbox'), verdict = $('verdict'), wlabel = $('wlabel');
  var R = 200;
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function pt(r, deg) {
    var a = deg * Math.PI / 180;
    return (r * Math.sin(a)).toFixed(2) + ' ' + (-r * Math.cos(a)).toFixed(2);
  }
  var COLORS = ['#2d0b57', '#1a1226', '#46168a'];

  function buildWheel(items, kind) {
    wheel.innerHTML = '';
    wheel.setAttribute('class', '');
    var N = items.length, a = 360 / N;
    var rot = el('g', { id: 'rot', style: 'transform-origin:0 0' }, wheel);
    for (var i = 0; i < N; i++) {
      var g = el('g', { 'class': 'seg' }, rot);
      var c = (N % 2 === 1 && i === N - 1) ? 2 : (i % 2);
      var d = 'M0 0 L' + pt(R, i * a - a / 2) + ' A' + R + ' ' + R + ' 0 0 1 ' + pt(R, i * a + a / 2) + ' Z';
      el('path', { 'class': 'bg', d: d, fill: COLORS[c], stroke: 'rgba(255,122,26,.45)', 'stroke-width': 1.5 }, g);
      var inner = el('g', { transform: 'rotate(' + (i * a) + ')' }, g);
      if (kind === 'sketch') {
        var size = Math.min(60, 2 * 140 * Math.sin(a * Math.PI / 360) * 0.92);
        var im = el('image', { x: -size / 2, y: -140 - size / 2, width: size, height: size }, inner);
        im.setAttribute('href', items[i].img);
      } else {
        var t = el('text', {
          transform: 'rotate(-90)', x: 52, y: 6, fill: INK,
          'font-family': 'Golos Text, Arial, sans-serif', 'font-weight': 700, 'font-size': 17
        }, inner);
        t.textContent = items[i].name;
      }
      g.dataset.i = i;
    }
    el('circle', { r: R + 4, fill: 'none', stroke: '#FF7A1A', 'stroke-width': 10 }, wheel);
    el('circle', { r: R + 4, fill: 'none', stroke: '#8a3a05', 'stroke-width': 10, 'stroke-opacity': .35, 'stroke-dasharray': '2 8' }, wheel);
    var B = 28;
    for (var b = 0; b < B; b++) {
      var p = pt(R + 4, b * 360 / B).split(' ');
      el('circle', { cx: p[0], cy: p[1], r: 3.6, 'class': 'bulb' + (b % 2 ? ' odd' : ''), fill: '#ffd27a' }, wheel);
    }
    el('circle', { r: 30, fill: '#120b1a', stroke: '#FF7A1A', 'stroke-width': 5 }, wheel);
    el('circle', { r: 14, fill: '#FF7A1A' }, wheel);
    el('circle', { r: 5, fill: '#120b1a' }, wheel);
    return rot;
  }

  function randInt(n) {
    var a = new Uint32Array(1);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return a[0] % n;
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function spinWheel(items, kind, label) {
    return new Promise(function (resolve) {
      wlabel.textContent = label;
      verdict.textContent = '';
      var rot = buildWheel(items, kind);
      box.classList.remove('fade');
      box.hidden = false;
      var N = items.length, a = 360 / N;
      var idx = randInt(N);
      var jitter = (Math.random() - 0.5) * a * 0.6;
      var turns = reduce ? 1 : 5 + randInt(3);
      var final = -(idx * a + jitter) + turns * 360;
      var dur = reduce ? 1200 : 5600;

      function finish() {
        wheel.classList.add('done');
        wheel.querySelector('.seg[data-i="' + idx + '"]').classList.add('win');
        verdict.textContent = items[idx].name;
        wait(reduce ? 900 : 2300).then(function () {
          box.classList.add('fade');
          return wait(650);
        }).then(function () { box.hidden = true; resolve(idx); });
      }
      void rot.getBoundingClientRect();
      requestAnimationFrame(function () {
        rot.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.62,.08,1)';
        rot.style.transform = 'rotate(' + final + 'deg)';
      });
      var done = false;
      function once() { if (done) return; done = true; finish(); }
      rot.addEventListener('transitionend', once);
      setTimeout(once, dur + 400);
    });
  }

  /* ---------- сценарий ---------- */
  var spinBtn = $('spin'), results = $('results'), hint = $('hint');
  var busy = false;

  function showResults(s, p) {
    $('imgSketch').src = sketches[s].img; $('imgSketch').alt = 'Эскиз: ' + sketches[s].name;
    $('imgPlace').src = places[p].img;    $('imgPlace').alt = 'Место: ' + places[p].name;
    $('nmSketch').textContent = sketches[s].name;
    $('nmPlace').textContent = places[p].name;
    results.hidden = false;
    // перезапуск анимации появления
    results.querySelectorAll('.card').forEach(function (c) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; });
  }

  spinBtn.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    $('stage').classList.add('spinning');
    spinBtn.disabled = true;
    spinBtn.hidden = true;
    hint.hidden = true;
    results.hidden = true;
    var s;
    spinWheel(sketches, 'sketch', 'Колесо эскизов').then(function (i) {
      s = i;
      return spinWheel(places, 'place', 'Куда набиваем');
    }).then(function (p) {
      showResults(s, p);
    }).catch(function () {}).then(function () {
      $('stage').classList.remove('spinning');
      spinBtn.hidden = false;
      spinBtn.disabled = false;
      spinBtn.classList.add('compact');
      busy = false;
    });
  });

  /* время по Москве */
  var clock = $('clock');
  var fmt;
  try {
    fmt = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  } catch (e) { fmt = null; }
  function tick() {
    var d = new Date();
    if (fmt) { clock.textContent = fmt.format(d); return; }
    var m = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 3 * 3600000);
    clock.textContent = [m.getHours(), m.getMinutes(), m.getSeconds()].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':');
  }
  tick();
  setInterval(tick, 1000);

  /* паутина в углу */
  $('cobweb').innerHTML = webInner(0, 0, 150, 14, 8).replace('<path ', '<path stroke-opacity=".55" ');
})();
</script>
